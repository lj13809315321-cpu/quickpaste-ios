# 墨指 Mozhi v1.8.17 真·同步输入法（iOS）
# 双 target：主 App（引导/地址设置/系统画中画 PiP）+ 键盘扩展（真正的系统键盘 UI）。
# 不硬编码 App Groups entitlement —— 手机端签名工具按自己的描述文件来；
# 共享通道在 Shared/QPSharedHistory.swift 里运行时自动选择。
# 用法：macOS 上 `xcodegen generate` 生成 Mozhi.xcodeproj

name: Mozhi

options:
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    # 关键：禁止 Xcode 自动生成 Info.plist，否则会覆盖仓库里的自定义 plist，
    # 导致产物缺 CFBundleIdentifier / NSExtension / ATS 例外。
    GENERATE_INFOPLIST_FILE: NO

targets:
  Mozhi:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mulberry6323.mozhi
        GENERATE_INFOPLIST_FILE: NO
        # v1.8.17：接入墨指图标（App/Assets.xcassets/AppIcon）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MozhiKeyboard
        embed: true

  MozhiKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
    info:
      path: Keyboard/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mulberry6323.mozhi.keyboard
        # v1.8.17：Swift 模块名改为 MozhiKeyboard（影响 NSExtensionPrincipalClass）
        PRODUCT_MODULE_NAME: MozhiKeyboard
        GENERATE_INFOPLIST_FILE: NO
        # 路线 E：桥接 ObjC 参考实现 KeyboardButtonBar（黄白风格底栏按钮）。
        # 该文件只需 import 需要的 ObjC 头文件，路径相对工程根目录。
        SWIFT_OBJC_BRIDGING_HEADER: Keyboard/MozhiKeyboard-Bridging-Header.h

schemes:
  Mozhi:
    build:
      targets:
        Mozhi: all
        MozhiKeyboard: all
    archive:
      config: Release
