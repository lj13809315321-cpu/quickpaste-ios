# QuickPaste 同步版（iOS）：单 App + 全屏 WKWebView，打开电脑端同步服务页面。
# 没有键盘扩展 / App Groups / 特殊 entitlement —— 爱思 7 天签名最容易过。
# 用法：macOS 上 `xcodegen generate` 生成 QuickPaste.xcodeproj

name: QuickPaste

options:
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    # 关键：禁止 Xcode 自动生成 Info.plist，否则会覆盖仓库里的自定义 plist，
    # 导致产物缺 CFBundleIdentifier / ATS 例外，爱思导入报「文件已损坏」、
    # WKWebView 也打不开 http 局域网页面。
    GENERATE_INFOPLIST_FILE: NO

targets:
  QuickPaste:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mulberry6323.twilight7904
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO

schemes:
  QuickPaste:
    build:
      targets:
        QuickPaste: all
    archive:
      config: Release
