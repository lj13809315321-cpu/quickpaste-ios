# QuickPaste v1.6 真·同步输入法（iOS）
# 双 target：主 App（引导/地址设置/系统画中画 PiP）+ 键盘扩展（真正的系统键盘 UI）。
# 不硬编码 App Groups entitlement —— 手机端签名工具按自己的描述文件来；
# 共享通道在 Shared/QPSharedHistory.swift 里运行时自动选择。
# 用法：macOS 上 `xcodegen generate` 生成 QuickPaste.xcodeproj

name: QuickPaste

options:
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    # 关键：禁止 Xcode 自动生成 Info.plist，否则会覆盖仓库里的自定义 plist，
    # 导致产物缺 CFBundleIdentifier / NSExtension / ATS 例外。
    GENERATE_INFOPLIST_FILE: NO

targets:
  QuickPaste:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mulberry6323.twilight7904
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: QuickPasteKeyboard
        embed: true

  QuickPasteKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
    info:
      path: Keyboard/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mulberry6323.twilight7904.keyboard
        PRODUCT_MODULE_NAME: QuickPasteKeyboard
        GENERATE_INFOPLIST_FILE: NO

schemes:
  QuickPaste:
    build:
      targets:
        QuickPaste: all
        QuickPasteKeyboard: all
    archive:
      config: Release
