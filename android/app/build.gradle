plugins {
    id 'com.android.application'
    // Kotlin 2.0 起 Compose 编译器已内置进 Kotlin 插件，规避 1.9.x 后端内联 CompositionLocal 崩溃
    // 注意：compose 插件只是编译器插件，必须在同模块同时应用 kotlin-android 才能拿到 kotlin{} DSL 与 Kotlin 编译器
    id 'org.jetbrains.kotlin.android' version '2.0.21'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.21'
}

android {
    namespace 'app.mulberry6323.mozhi'
    compileSdk 34

    defaultConfig {
        applicationId 'app.mulberry6323.mozhi'
        minSdk 24
        targetSdk 34
        versionCode 53
        versionName '1.8.34-float'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    // 提供 XML 主题父样式 Theme.Material3.DayNight.NoActionBar（Compose 的 material3 只含 Kotlin 组件，不含 XML 样式）
    implementation 'com.google.android.material:material:1.12.0'
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
