# 在 GitHub 提供的 macOS 运行器上编译出「未签名 IPA」。
# 关键坑：
#   - iOS 18.5 SDK 禁止在 archive 阶段用 ad-hoc("-") 签名，且
#   - 若完全不签名(CODE_SIGNING_ALLOWED=NO)，archive 的 ValidateEmbeddedBinary
#     会因内嵌的键盘扩展未签名而失败（退出码 70）。
# 解法：用 `xcodebuild build`（不归档，避开 iOS 18.5 禁止 archive 阶段 ad-hoc 的限制）
# 产出未签名 .app，再用命令行补一个 ad-hoc 签名（`codesign -s -`）给主 app 与键盘扩展，
# 最后压成 IPA。
# 关键：爱思/轻松签在「导入 IPA」时会预检二进制是否带签名，纯未签名会被判「文件已损坏」
# 而拒绝导入；补上 ad-hoc 签名后它们就能正常导入，再由用户用 Apple ID / 证书重签安装。
# 触发方式：仓库 → Actions → 生成未签名 IPA → Run workflow。

name: 生成未签名 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 环境诊断
        run: |
          echo "=== Xcode 版本 ==="
          xcodebuild -version
          echo "=== 可用 Xcode 列表 ==="
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          set -euo pipefail
          xcodegen generate

      - name: 列出工程方案
        run: |
          set -euo pipefail
          xcodebuild -list -project QuickPaste.xcodeproj

      - name: 编译（build 不归档，避开 iOS 18.5 禁止 ad-hoc 归档的限制）
        run: |
          set -euo pipefail
          xcodebuild \
            -project QuickPaste.xcodeproj \
            -scheme QuickPaste \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            GENERATE_INFOPLIST_FILE=NO \
            INFOPLIST_FILE=App/Info.plist \
            QuickPasteKeyboard:INFOPLIST_FILE=Keyboard/Info.plist \
            clean build 2>&1 | tee build.log
        continue-on-error: false

      - name: 为二进制补 ad-hoc 签名（让爱思/轻松签能导入）
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/QuickPaste.app"
          EXT="$APP/PlugIns/QuickPasteKeyboard.appex"
          echo "=== ad-hoc 签名键盘扩展 ==="
          codesign --force --timestamp=none -s - "$EXT"
          echo "=== ad-hoc 签名主 app ==="
          codesign --force --timestamp=none -s - "$APP"
          echo "=== 校验签名 ==="
          codesign -vvv "$APP"

      - name: 打包为 IPA（已含 ad-hoc 签名，供爱思/轻松签重签）
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/QuickPaste.app"
          echo "=== 产物路径 ==="
          ls -la "$APP"
          echo "=== 确认主 app 与键盘扩展都在 ==="
          ls -la "$APP/PlugIns"
          rm -rf Payload QuickPaste-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          echo "=== 打包 IPA（完全未签名）==="
          zip -qr QuickPaste-unsigned.ipa Payload
          echo "=== IPA 生成完成 ==="
          ls -la QuickPaste-unsigned.ipa
          echo "=== 校验 IPA 可被正常解压 ==="
          unzip -l QuickPaste-unsigned.ipa | head -n 20

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: QuickPaste-unsigned-ipa
          path: QuickPaste-unsigned.ipa

      - name: 上传原始 .app（供用户自行打包/签名）
        uses: actions/upload-artifact@v4
        with:
          name: QuickPaste-app
          path: build/Build/Products/Release-iphoneos/QuickPaste.app

      - name: 上传构建日志（失败时排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
