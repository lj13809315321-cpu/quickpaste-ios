# 在 GitHub 提供的 macOS 运行器上编译出「可重签的 IPA」。
# 关键：用 CODE_SIGN_IDENTITY="-" 做 ad-hoc 自签，让主 app 与内嵌的键盘扩展
# 都带有一个合法的（本地）签名，从而通过 Xcode 对扩展的 ValidateEmbeddedBinary 校验。
# 这种签名不含真实证书，下载到手机后由手机端签名工具用那张 Ad Hoc 证书整体重签安装。
# 触发方式：仓库 → Actions → 生成未签名 IPA → Run workflow。

name: 生成未签名 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 环境诊断
        run: |
          echo "=== Xcode 版本 ==="
          xcodebuild -version
          echo "=== 可用 Xcode 列表 ==="
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          set -euo pipefail
          xcodegen generate

      - name: 列出工程方案
        run: |
          set -euo pipefail
          xcodebuild -list -project QuickPaste.xcodeproj

      - name: 编译归档（ad-hoc 自签，规避扩展校验失败）
        run: |
          set -euo pipefail
          xcodebuild \
            -project QuickPaste.xcodeproj \
            -scheme QuickPaste \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/QuickPaste.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean archive 2>&1 | tee build.log
        continue-on-error: false

      - name: 打包为 IPA
        run: |
          set -euo pipefail
          rm -rf Payload QuickPaste-unsigned.ipa
          mkdir -p Payload
          cp -R "$PWD/build/QuickPaste.xcarchive/Products/Applications/QuickPaste.app" Payload/
          zip -qr QuickPaste-unsigned.ipa Payload

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: QuickPaste-unsigned-ipa
          path: QuickPaste-unsigned.ipa

      - name: 上传构建日志（失败时排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
