name: build-inputmethod

on:
  push:
    branches: [inputmethod]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme PinyinKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            GENERATE_INFOPLIST_FILE=NO \
            clean build 2>&1 | tee build.log

      - name: Fix Info.plists (force critical keys incl. NSExtensionPrincipalClass)
        run: python3 scripts/fix_info_plists.py build

      - name: Write code-signature slots (ad-hoc, so phone tool can re-sign)
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/PinyinKeyboard.app"
          EXT="$APP/PlugIns/PinyinKeyboardKeyboard.appex"
          ls -la "$APP/PlugIns"
          codesign --force --timestamp=none -s - "$EXT"
          codesign --force --timestamp=none -s - "$APP"
          codesign -vvv "$APP"

      - name: Package signed IPA (intermediate, not delivered)
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/PinyinKeyboard.app"
          mkdir -p dist
          rm -rf Payload dist/PinyinKeyboard-signed.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr dist/PinyinKeyboard-signed.ipa Payload
          echo "=== 已签名中间包内容 ==="
          unzip -l dist/PinyinKeyboard-signed.ipa | grep -E 'Info.plist|PinyinKeyboardKeyboard|PkgInfo|PinyinKeyboard$' | head -20

      - name: Make unsigned IPA (phone signing tool imports this)
        run: python3 scripts/make_unsigned_ipa.py dist/PinyinKeyboard-signed.ipa out/PinyinKeyboard-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: pinyin-ipa
          path: out/*.ipa
          retention-days: 3
