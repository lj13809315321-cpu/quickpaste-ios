# QuickPaste v1.8.4 真·同步输入法：一次编译产出「安卓 APK + iOS IPA」。
#
# 与之前的 WebView 壳完全不同：
#   安卓 = InputMethodService（BIND_INPUT_METHOD / android.view.im）
#   iOS  = Keyboard Extension（.appex / com.apple.keyboard-service）
# 两端都是原生键盘 UI，界面 1:1 对齐 quickpaste-ios-prototype.html，
# 数据源是电脑端 sync/server.js 的局域网同步服务。
#
# 1) push 自动触发，不需要 token / 手动点 Run。
# 2) 产物由 publish job 提交回仓库 out/，本机 git pull 即可取回。
# 3) iOS 只交付【未签名 IPA】，供手机端签名工具直接导入；构造对齐用户
#    提供的未签名 IPA 参照样本。ad-hoc 预签名只作为编译中间步骤，不交付。

name: 编译同步输入法 (APK + IPA)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'out/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 准备 Gradle Wrapper（失败就用已安装的 Gradle 8.7 直编）
        working-directory: android
        run: |
          set -uo pipefail
          if command -v gradle >/dev/null 2>&1; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin || echo "[WARN] wrapper 生成失败，稍后直接用 gradle 编译"
          else
            echo "[WARN] PATH 里没有 gradle，稍后用 wrapper 或直接失败上报"
          fi
          ls -la || true

      - name: 编译 debug APK（自带 debug 签名，可直接安装）
        working-directory: android
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: 输出 APK 结构诊断（严格校验在本机拉回产物后做）
        run: |
          set -euo pipefail
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$SRC"
          mkdir -p dist
          cp "$SRC" dist/QuickPaste-Sync-Android.apk
          python3 - <<'PY'
          import zipfile
          p = 'dist/QuickPaste-Sync-Android.apk'
          z = zipfile.ZipFile(p)
          names = z.namelist()
          axml = z.read('AndroidManifest.xml')
          dex = b''.join(z.read(n) for n in names if n.endswith('.dex'))
          def has(s):
              return (s.encode() in axml) or (s.encode('utf-16le') in axml)
          print('[诊断] zip 条目数 =', len(names))
          print('[诊断] AXML QuickPasteIME =', has('QuickPasteIME'))
          print('[诊断] AXML BIND_INPUT_METHOD =', has('BIND_INPUT_METHOD'))
          print('[诊断] AXML android.view.im =', has('android.view.im'))
          for key in (b'SyncClient', b'/api/items', b'/api/image', b'commitText', b'QuickPasteIME'):
              print('[诊断] dex %-14s = %s' % (key.decode(), key in dex))
          print('[诊断] dex 含 WebView 类型 =', b'Landroid/webkit/WebView;' in dex)
          print('[诊断] dex 字节数 =', len(dex))
          PY
          ls -lh dist/QuickPaste-Sync-Android.apk

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: qp-apk
          path: dist/QuickPaste-Sync-Android.apk
          if-no-files-found: error

  ipa:
    # 2026-11-10：GitHub 的 macOS arm64 托管 runner 容量不足，任务排队约 15 分钟
    # 后被系统取消（"The job was not acquired by Runner of type hosted"）。
    # 改用 Intel 镜像池，避开拥塞的 arm64 池；Xcode 与 SDK 版本保持一致。
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: 环境诊断
        run: |
          xcodebuild -version
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true

      - name: 安装 XcodeGen
        run: brew install xcodegen

      # v1.9：画中画改成【视频通话 PiP】——窗口内容由 QPPiPViewController 直接绘制，
      # 不再需要 pip.mp4 这种视频文件（旧方案会被系统当成视频播放器，显示播放控件）。
      - name: 准备资源目录
        run: mkdir -p App/Resources && ls -la App

      - name: 生成 Xcode 工程（主 App + 键盘扩展 双 target）
        run: xcodegen generate

      - name: 列出工程方案
        run: xcodebuild -list -project QuickPaste.xcodeproj

      - name: 编译（build 不归档，避开 iOS 18.5 禁止 archive 阶段 ad-hoc 的限制）
        run: |
          set -euo pipefail
          xcodebuild \
            -project QuickPaste.xcodeproj \
            -scheme QuickPaste \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            GENERATE_INFOPLIST_FILE=NO \
            clean build 2>&1 | tee build.log

      - name: 修正两个 Info.plist（BundleID / NSExtension / ATS）
        run: |
          set -euo pipefail
          python3 scripts/fix_info_plists.py
          APP="$PWD/build/Build/Products/Release-iphoneos/QuickPaste.app"
          echo "=== 主 app ==="
          plutil -p "$APP/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleExecutable|CFBundlePackageType|NSAppTransportSecurity|NSLocalNetwork' || true
          echo "=== 键盘扩展 ==="
          plutil -p "$APP/PlugIns/QuickPasteKeyboard.appex/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleExecutable|CFBundlePackageType|NSExtension|NSAppTransportSecurity' || true

      - name: 中间步骤：生成代码签名槽位（预签名包不交付）
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/QuickPaste.app"
          EXT="$APP/PlugIns/QuickPasteKeyboard.appex"
          codesign --force --timestamp=none -s - "$EXT"
          codesign --force --timestamp=none -s - "$APP"
          codesign -vvv "$APP"
          ls -la "$APP/PlugIns"

      - name: 打包并校验 IPA 内真的有键盘扩展
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/QuickPaste.app"
          mkdir -p dist
          rm -rf Payload dist/QuickPaste-Sync-iOS.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr dist/QuickPaste-Sync-iOS.ipa Payload
          echo "=== IPA 内容（关键条目）==="
          unzip -l dist/QuickPaste-Sync-iOS.ipa | grep -E 'Info.plist|QuickPasteKeyboard|PkgInfo|QuickPaste$' | head -20
          python3 - <<'PY'
          import plistlib, zipfile
          z = zipfile.ZipFile('dist/QuickPaste-Sync-iOS.ipa')
          names = z.namelist()
          app_plist = 'Payload/QuickPaste.app/Info.plist'
          ext_plist = 'Payload/QuickPaste.app/PlugIns/QuickPasteKeyboard.appex/Info.plist'
          ext_bin   = 'Payload/QuickPaste.app/PlugIns/QuickPasteKeyboard.appex/QuickPasteKeyboard'
          for p in (app_plist, ext_plist, ext_bin):
              assert p in names, 'IPA 缺文件: ' + p
          a = plistlib.loads(z.read(app_plist))
          e = plistlib.loads(z.read(ext_plist))
          assert a.get('CFBundleIdentifier') == 'app.mulberry6323.twilight7904'
          assert a.get('CFBundlePackageType') == 'APPL'
          assert e.get('CFBundleIdentifier') == 'app.mulberry6323.twilight7904.keyboard'
          assert e.get('CFBundlePackageType') == 'XPC!'
          ns = e.get('NSExtension') or {}
          attrs = ns.get('NSExtensionAttributes') or {}
          assert ns.get('NSExtensionPointIdentifier') == 'com.apple.keyboard-service', ns
          assert attrs.get('RequestsOpenAccess') is True, '键盘扩展缺 RequestsOpenAccess'
          assert (e.get('NSAppTransportSecurity') or {}).get('NSAllowsArbitraryLoads') is True
          macho = z.read(ext_bin)[:4]
          assert macho == b'\xcf\xfa\xed\xfe', '键盘扩展不是 arm64 Mach-O'
          appbin = z.read('Payload/QuickPaste.app/QuickPaste')[:4]
          assert appbin == b'\xcf\xfa\xed\xfe', '主程序不是 arm64 Mach-O'
          assert a.get('UIBackgroundModes') == ['audio'], '主 App 缺画中画后台模式'
          schemes = [s for t in (a.get('CFBundleURLTypes') or [])
                     for s in (t.get('CFBundleURLSchemes') or [])]
          assert 'quickpaste' in schemes, '主 App 缺 quickpaste URL scheme'
          print('[OK] PiP 后台模式 / URL scheme 齐全（视频通话 PiP 不需要视频资源）')
          print('[OK] 主 App + 键盘扩展(.appex) 均在 IPA 内')
          print('[OK] 扩展点 =', ns.get('NSExtensionPointIdentifier'))
          print('[OK] 完全访问 =', attrs.get('RequestsOpenAccess'))
          print('[OK] 扩展 ATS =', e.get('NSAppTransportSecurity'))
          PY

      - name: 派生【未签名 IPA】（手机端签名工具直接导入）
        run: |
          set -euo pipefail
          python3 scripts/make_unsigned_ipa.py \
            dist/QuickPaste-Sync-iOS.ipa \
            dist/QuickPaste-Sync-iOS-unsigned.ipa
          echo "=== 交付产物 ==="
          ls -lh dist/QuickPaste-Sync-iOS-unsigned.ipa

      - name: 上传 IPA 产物（只传未签名包）
        uses: actions/upload-artifact@v4
        with:
          name: qp-ipa
          path: dist/QuickPaste-Sync-iOS-unsigned.ipa
          if-no-files-found: error

      - name: 上传构建日志（失败时排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build.log
          if-no-files-found: warn

  publish:
    needs: [apk, ipa]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 下载两个产物
        uses: actions/download-artifact@v4
        with:
          pattern: qp-*
          path: out
          merge-multiple: true

      - name: 校验产物并提交回仓库
        run: |
          set -euo pipefail
          mkdir -p out
          echo "=== out/ 内容 ==="
          ls -lh out/
          APK=out/QuickPaste-Sync-Android.apk
          UIPA=out/QuickPaste-Sync-iOS-unsigned.ipa
          [ -f "$APK" ] || { echo "::error::缺 APK"; exit 1; }
          [ -f "$UIPA" ] || { echo "::error::缺未签名 IPA"; exit 1; }
          # 旧的 ad-hoc 预签名包不再交付，从仓库移除
          git rm -f --ignore-unmatch out/QuickPaste-Sync-iOS.ipa || true
          rm -f out/QuickPaste-Sync-iOS.ipa
          {
            echo "QuickPaste v1.8.4 同步输入法 手机安装包"
            echo "形态：安卓 IME / iOS 键盘扩展（原生键盘，非 WebView 壳）"
            echo "苹果交付：未签名 IPA（手机端签名工具直接导入）"
            echo "构建时间 (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "commit: ${GITHUB_SHA}"
            echo "APK: $(stat -c%s "$APK") bytes"
            echo "IPA(未签名): $(stat -c%s "$UIPA") bytes"
          } > out/BUILD_INFO.txt
          git config user.name "quickpaste-bot"
          git config user.email "quickpaste-bot@users.noreply.github.com"
          git add -f out/QuickPaste-Sync-Android.apk out/QuickPaste-Sync-iOS-unsigned.ipa out/BUILD_INFO.txt
          git commit -m "chore: 自动回传同步输入法 APK + IPA [skip ci]" || echo "无变更，跳过提交"
          git pull --rebase origin main || true
          git push origin HEAD:main
