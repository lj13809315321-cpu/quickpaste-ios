# QuickPaste 同步版：一次编译产出「安卓 APK + iOS 未签名 IPA」。
#
# 关键设计：
# 1) push 自动触发（不需要任何 token / 手动点 Run）。
# 2) 编译产物由 publish job 统一提交回仓库 out/ 目录，本机 git pull 即可取回。
# 3) iOS 为「单 App + WKWebView」，没有键盘扩展 / App Groups / entitlement，
#    ad-hoc 签名后即可用爱思助手 Apple ID（7 天免费签）重签安装。
# 4) GITHUB_TOKEN 的 push 不会再次触发本 workflow（GitHub 防循环），且 out/ 被排除。
name: 编译同步版手机安装包 (APK + IPA)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'out/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 生成 Gradle Wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: 编译 debug APK（自带 debug 签名，可直接安装）
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 校验并改名
        run: |
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$SRC"
          unzip -l "$SRC" | grep -E 'classes.*dex|AndroidManifest.xml' || true
          mkdir -p dist
          cp "$SRC" dist/QuickPaste-Sync-Android.apk
          echo "=== APK 大小 ==="; ls -lh dist/QuickPaste-Sync-Android.apk

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: qp-apk
          path: dist/QuickPaste-Sync-Android.apk
          if-no-files-found: error

  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 环境诊断
        run: |
          xcodebuild -version
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程（单 App，无键盘扩展）
        run: xcodegen generate

      - name: 列出工程方案
        run: xcodebuild -list -project QuickPaste.xcodeproj

      - name: 编译（build 不归档，单 App 无扩展，避开签名校验）
        run: |
          set -euo pipefail
          xcodebuild \
            -project QuickPaste.xcodeproj \
            -scheme QuickPaste \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            GENERATE_INFOPLIST_FILE=NO \
            clean build 2>&1 | tee build.log

      - name: 修正 Info.plist（补回 BundleID / ATS / 本地网络描述）
        run: |
          set -euo pipefail
          python3 scripts/fix_info_plists.py
          APP="$PWD/build/Build/Products/Release-iphoneos/QuickPaste.app"
          echo "=== 校验产物 plist ==="
          plutil -p "$APP/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleExecutable|CFBundlePackageType|NSAppTransportSecurity|NSLocalNetwork' || true

      - name: 为二进制补 ad-hoc 签名（让爱思/轻松签能导入重签）
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/QuickPaste.app"
          codesign --force --timestamp=none -s - "$APP"
          codesign -vvv "$APP"

      - name: 打包为 IPA
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/QuickPaste.app"
          mkdir -p dist
          rm -rf Payload dist/QuickPaste-Sync-iOS.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr dist/QuickPaste-Sync-iOS.ipa Payload
          echo "=== IPA 内容 ==="
          unzip -l dist/QuickPaste-Sync-iOS.ipa | head -20
          echo "=== 从 IPA 内直接校验关键字段 ==="
          python3 - <<'PY'
          import plistlib, zipfile
          z = zipfile.ZipFile('dist/QuickPaste-Sync-iOS.ipa')
          p = 'Payload/QuickPaste.app/Info.plist'
          assert p in z.namelist(), 'IPA 缺 Info.plist'
          a = plistlib.loads(z.read(p))
          assert a.get('CFBundleIdentifier') == 'app.mulberry6323.twilight7904', a.get('CFBundleIdentifier')
          assert a.get('NSAppTransportSecurity', {}).get('NSAllowsArbitraryLoads') is True, '缺 ATS 例外'
          assert a.get('NSLocalNetworkUsageDescription'), '缺本地网络描述'
          exe = z.read('Payload/QuickPaste.app/QuickPaste')[:4]
          assert exe == b'\xcf\xfa\xed\xfe', '可执行文件不是 arm64 Mach-O'
          print('[OK] BundleID / ATS / 本地网络 / arm64 Mach-O 全部通过')
          PY

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: qp-ipa
          path: dist/QuickPaste-Sync-iOS.ipa
          if-no-files-found: error

      - name: 上传构建日志（失败时排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build.log
          if-no-files-found: warn

  publish:
    needs: [apk, ipa]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 下载两个产物
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: qp-*
          path: out
          merge-multiple: true

      - name: 校验产物并提交回仓库
        run: |
          set -euo pipefail
          mkdir -p out
          echo "=== out/ 内容 ==="
          ls -lh out/ || true
          APK=out/QuickPaste-Sync-Android.apk
          IPA=out/QuickPaste-Sync-iOS.ipa
          [ -f "$APK" ] || { echo "::error::缺 APK"; exit 1; }
          [ -f "$IPA" ] || { echo "::error::缺 IPA"; exit 1; }
          # 写一份构建信息，方便本机确认时间/版本
          {
            echo "QuickPaste 同步版 手机安装包"
            echo "构建时间 (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "commit: ${GITHUB_SHA}"
            echo "APK: $(stat -c%s "$APK") bytes"
            echo "IPA: $(stat -c%s "$IPA") bytes"
          } > out/BUILD_INFO.txt
          git config user.name "quickpaste-bot"
          git config user.email "quickpaste-bot@users.noreply.github.com"
          # .gitignore 忽略 *.ipa，用 -f 强制加入
          git add -f out/QuickPaste-Sync-Android.apk out/QuickPaste-Sync-iOS.ipa out/BUILD_INFO.txt
          git commit -m "chore: 自动回传同步版 APK + IPA [skip ci]" || echo "无变更，跳过提交"
          git pull --rebase origin main || true
          git push origin HEAD:main
