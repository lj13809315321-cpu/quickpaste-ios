name: 构建安卓版 QuickPaste APK

# 与 iOS 版完全独立：安卓 debug 构建自带 debug keystore 签名，
# 产出的 APK 可直接安装到手机，不需要 Apple ID / 描述文件 / 7 天续签。
# 触发方式：仓库 → Actions → 构建安卓版 QuickPaste APK → Run workflow。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 镜像已预装完整 Android SDK（ANDROID_HOME），
      # 不要再用第三方 setup-android：它在新版运行器上会去装已下架的旧 tools 包而失败。
      - name: 确认并按需补装 SDK 组件
        shell: bash
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDKROOT=$SDKROOT"
          SDKMGR=$(find "$SDKROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMGR"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" --install "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi
          echo "platforms:";  ls "$SDKROOT/platforms"  || true
          echo "build-tools:"; ls "$SDKROOT/build-tools" || true

      - name: 设置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 生成 Gradle Wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: 编译 debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 校验产物
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          echo "=== APK 内容 ==="
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | head -20

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickPaste-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
